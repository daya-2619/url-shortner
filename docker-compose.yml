services:
  redis:
    image: redis:latest
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes

  kgs:
    build:
      context: ./kgs
      dockerfile: Dockerfile
    container_name: url_shortener_kgs
    ports:
      - "8001:8001"
    environment:
      - MACHINE_ID=k
    restart: unless-stopped

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    # container_name removed to allow multiple replicas
    deploy:
      replicas: 3
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - kgs
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: url_shortener_nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://nginx:8000
    container_name: url_shortener_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://nginx:8000
    depends_on:
      - nginx
    restart: unless-stopped
