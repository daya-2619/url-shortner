version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: url_shortener_backend
    ports:
      - "8000:8000"
    environment:
      # Inject the unique machine ID per backend replica
      - MACHINE_ID=b
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: url_shortener_frontend
    ports:
      - "3001:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - backend
    restart: unless-stopped
